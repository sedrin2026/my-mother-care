<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY MOTHER CARE 管理者ログイン</title><style>*{box-sizing:border-box}body{margin:0;background:#eefaff;font-family:system-ui,sans-serif;color:#17354e}.w{min-height:100vh;display:grid;place-items:center;padding:20px}.c{width:min(100%,520px);background:white;padding:28px 20px;border-radius:24px;text-align:center;border:2px solid #cdebf5}h1{color:#1477b8}button{width:100%;padding:15px;border-radius:28px;font-size:20px;font-weight:bold;background:white;border:2px solid #ddd}.s{margin-top:18px;padding:14px;border-radius:16px;background:#effbff;font-weight:bold;word-break:break-all}.ok{background:#eaffef;color:#087b3a}.err{background:#fff0f3;color:#bd1743}#out{display:none;margin-top:10px}</style></head><body><div class="w"><main class="c"><div style="font-size:48px">👨‍👩‍👧‍👦</div><h1>MY MOTHER CARE</h1><p><b>管理者用ログインテスト 🔐</b></p><button id="in">G　Googleでログイン</button><button id="out">ログアウト</button><div id="s" class="s">まだログインしていません。</div></main></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyDUccPZVteo8ikjRXgZYBuy2vcG9Chpqr8",authDomain:"my-mother-care.firebaseapp.com",projectId:"my-mother-care",storageBucket:"my-mother-care.firebasestorage.app",messagingSenderId:"772945697337",appId:"1:772945697337:web:03b249c3767237ea210be8"});
const auth=getAuth(app),provider=new GoogleAuthProvider(),i=document.getElementById("in"),o=document.getElementById("out"),s=document.getElementById("s");provider.setCustomParameters({prompt:"select_account"});
i.onclick=async()=>{s.className="s";s.textContent="Googleログインを開いています…";try{await signInWithPopup(auth,provider)}catch(e){s.className="s err";s.textContent="ログインできませんでした："+(e.code||e.message)}};
o.onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){i.style.display="none";o.style.display="block";s.className="s ok";s.innerHTML="✅ Googleログイン成功！<br>UID：<br>"+u.uid}else{i.style.display="block";o.style.display="none";if(!s.classList.contains("err")){s.className="s";s.textContent="まだログインしていません。"}}});
</script></body></html>
