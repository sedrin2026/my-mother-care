<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>お薬飲めたかな？</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#c8f3ee;color:#17354e;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{width:min(100%,760px);margin:auto;min-height:100dvh;background:linear-gradient(#8ad9fb,#e6faff 31%,#d5f3e4);padding-bottom:18px}.hero img{display:block;width:100%;height:auto}.list{display:grid;gap:9px;padding:9px}.q{background:#fff;border:2px solid #d8f0f5;border-radius:20px;overflow:hidden;box-shadow:0 4px 11px #17657d20}.row{display:grid;grid-template-columns:48px 1fr 36px minmax(78px,20%) minmax(78px,20%);gap:6px;align-items:center;padding:11px 8px;min-height:86px}.ico{font-size:36px;text-align:center}.text{font-size:clamp(20px,4.9vw,30px);font-weight:1000;line-height:1.13}.check{width:32px;height:32px;border:3px solid #7f909d;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#e60012;font-size:28px;font-weight:1000;line-height:1}.yn{border:0;border-radius:29px;padding:12px 2px;color:#fff;font-size:clamp(20px,4.7vw,28px);font-weight:1000;box-shadow:inset 0 2px #ffffff70,0 3px 7px #0002}.yes{background:linear-gradient(#1bc651,#00982e)}.no{background:linear-gradient(#ff63a2,#ff1772)}.yn.selected{outline:4px solid #ffd72b}
.detail{max-height:0;opacity:0;overflow:hidden;padding:0 12px;background:#f8fdff;transition:max-height .42s ease,opacity .28s ease,padding .42s ease}.detail.open{max-height:440px;opacity:1;padding:12px;border-top:2px solid #b9e9f5}.panel,.note{border:2px solid #74cce9;border-radius:15px;background:#effbff;padding:12px;text-align:center;font-size:clamp(19px,4.5vw,26px);font-weight:1000}.note.pink{border-color:#ffb5cf;background:#fff1f6;color:#e82360}.up{color:#e60012;font-size:1.3em}.title{color:#1269a3;margin-bottom:10px}.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.chip{min-height:50px;border:2px solid #88b7cc;border-radius:14px;background:#fff;color:#173b59;font-size:clamp(17px,4vw,22px);font-weight:1000;padding:6px 2px}.chip.picked{background:#14a8ef;color:#fff;border-color:#087bc0;box-shadow:inset 0 2px 4px #fff7}textarea{width:100%;min-height:122px;border:2px solid #7aa8c7;border-radius:13px;padding:13px;background:#fff;color:#173b59;font:800 clamp(18px,4.2vw,23px) system-ui}textarea::placeholder{color:#9caab3;opacity:.62}.hint{text-align:center;margin:13px 8px 5px;color:#ef2866;font-size:clamp(19px,4.5vw,26px);font-weight:1000}.send{display:block;width:94%;margin:0 3%;border:0;border-radius:32px;padding:15px;background:linear-gradient(#1bbaff,#0877ec);color:#fff;font-size:clamp(28px,6.4vw,41px);font-weight:1000;box-shadow:0 5px 12px #0877ec55}.sub{text-align:center;color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(90%,620px);background:#fff;border:3px solid #159eea;border-radius:18px;padding:12px;text-align:center;font-weight:1000;display:none;z-index:20}.toast.show{display:block}
@media(max-width:480px){.row{grid-template-columns:40px 1fr 29px 71px 71px;gap:4px;padding:10px 5px;min-height:80px}.ico{font-size:31px}.check{width:28px;height:28px;font-size:24px}.yn{padding:11px 1px}.chips{gap:6px}}
</style></head><body><main class="app"><div class="hero"><img src="my-mother-care-header-latest.webp" alt="お薬飲めたかな？"></div><section class="list" id="list"></section><div class="hint">全て答えたら送信ボタン押してね！</div><button class="send" id="send">✈️ 返事を送る</button><div class="sub">今日の回答を保存します</div></main><div class="toast" id="toast"></div>
<script>
const data=[["🍚","朝ごはん食べた？","food"],["🥤","水分は摂ってるかな？","water"],["💊","心臓の薬は飲んだかな？","heart"],["❤️","血圧の薬は飲んだかな？","bp"],["🚶","少し運動しようね！","move"],["🙂","体調悪いところあるかな？","health"],["❓","困った事ある？","trouble"]],answers=Array(7).fill(null),list=document.getElementById("list"),sets={food:new Set(),health:new Set()};
function chips(a,k){return `<div class="chips">${a.map(x=>`<button type="button" class="chip" data-key="${k}" data-value="${x}">${x}</button>`).join("")}</div>`}
function content(t,v){
if(t==="food"&&v==="yes")return `<div class="panel"><div class="title">🥢🍴何を食べたかな？<br>（食べた物の、ボタンを押してね！）</div>${chips(["パン","コーヒー","缶詰","バナナ","ヨーグルト","ゆで卵","カップ麺","チーズ","トマト"],"food")}</div>`;
if(t==="food"&&v==="no")return `<div class="note pink">ちゃんと食べな駄目だよ！</div>`;
if(t==="water"&&v==="no")return `<div class="note">💧 熱中症になるから、飲んでね！</div>`;
if(t==="heart"&&v==="no")return `<div class="note pink">血管が詰まるから飲まないと駄目だよ！</div>`;
if(t==="bp"&&v==="no")return `<div class="note pink"><span class="up">⤴</span> 血圧が高くなるから飲んでね！</div>`;
if(t==="move"&&v==="no")return `<div class="note">🦶 足踏みでも良いからしてね！</div>`;
if(t==="health"&&v==="yes")return `<div class="panel"><div class="title">どこが悪い？<br>痛いところのボタンを押してね！</div>${chips(["頭","咳","熱","腰","尾骶骨","足の付け根"],"health")}</div>`;
if(t==="trouble"&&v==="yes")return `<div class="panel"><textarea placeholder="ここをタップして入力してね"></textarea></div>`;return ""}
data.forEach((d,i)=>{const q=document.createElement("article");q.className="q";q.innerHTML=`<div class="row"><div class="ico">${d[0]}</div><div class="text">${d[1]}</div><div class="check"></div><button class="yn yes">はい</button><button class="yn no">いいえ</button></div><div class="detail"></div>`;const y=q.querySelector(".yes"),n=q.querySelector(".no"),c=q.querySelector(".check"),det=q.querySelector(".detail");function choose(v){answers[i]=v;c.textContent="✓";y.classList.toggle("selected",v==="yes");n.classList.toggle("selected",v==="no");const h=content(d[2],v);det.classList.remove("open");setTimeout(()=>{det.innerHTML=h;det.classList.toggle("open",!!h);det.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const set=sets[b.dataset.key];set.has(b.dataset.value)?set.delete(b.dataset.value):set.add(b.dataset.value);b.classList.toggle("picked",set.has(b.dataset.value))})},80)}y.onclick=()=>choose("yes");n.onclick=()=>choose("no");list.appendChild(q)});
send.onclick=()=>{const t=document.getElementById("toast");if(!answers.every(Boolean))t.textContent="まだ答えていない項目があるよ😊";else{const trouble=document.querySelector("textarea")?.value||"";localStorage.setItem("motherCareLastAnswers",JSON.stringify({at:new Date().toISOString(),answers,food:[...sets.food],health:[...sets.health],trouble}));t.textContent="回答を保存したよ😊"}t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
</script></body></html>
