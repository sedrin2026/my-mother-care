<style>
*{box-sizing:border-box}html,body{margin:0;background:#c8f3ee;color:#17354e;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{width:min(100%,760px);margin:auto;min-height:100dvh;background:linear-gradient(#8ad9fb,#e6faff 31%,#d5f3e4);padding-bottom:18px}.hero{position:relative;aspect-ratio:1024/493;background:url("my-mother-care-nanohana-header-v16.webp") center/cover no-repeat;overflow:hidden}.datebox{position:absolute;right:5.7%;top:29.5%;width:32.5%;height:32%;background:#f8ffff;border-radius:17px;display:grid;grid-template-columns:35% 65%;grid-template-rows:38% 62%;align-items:center;text-align:center;font-weight:1000;box-shadow:0 3px 8px #0002}.date{grid-column:1/3;font-size:clamp(12px,3vw,19px)}.weather{font-size:clamp(29px,7vw,48px)}.time{font-size:clamp(30px,7.7vw,52px);letter-spacing:-2px}.greeting{position:absolute;right:4.5%;bottom:3%;width:37%;height:26%;border-radius:18px;background:#fff0f7ee;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#ed2364;font-weight:1000;font-size:clamp(16px,4vw,25px);line-height:1.15}.greeting small{color:#173451;font-size:clamp(10px,2.6vw,16px);margin-top:5px}.bubbleText{position:absolute;left:25.1%;top:38%;width:10%;height:45%;display:flex;flex-direction:row-reverse;justify-content:center;gap:3px;color:#172d55;font-weight:1000;font-size:clamp(15px,3.8vw,24px);line-height:1}.vert{writing-mode:vertical-rl;text-orientation:upright}.list{display:grid;gap:9px;padding:9px}.q{background:#fff;border:2px solid #d8f0f5;border-radius:20px;overflow:hidden;box-shadow:0 4px 11px #17657d20}.row{display:grid;grid-template-columns:48px 1fr 36px minmax(78px,20%) minmax(78px,20%);gap:6px;align-items:center;padding:11px 8px;min-height:86px}.ico{font-size:36px;text-align:center}.text{font-size:clamp(20px,4.9vw,30px);font-weight:1000;line-height:1.13}.check{width:32px;height:32px;border:3px solid #7f909d;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#e60012;font-size:28px;font-weight:1000;line-height:1}.yn{border:0;border-radius:29px;padding:12px 2px;color:#fff;font-size:clamp(20px,4.7vw,28px);font-weight:1000;box-shadow:inset 0 2px #ffffff70,0 3px 7px #0002}.yes{background:linear-gradient(#1bc651,#00982e)}.no{background:linear-gradient(#ff63a2,#ff1772)}.yn.selected{outline:4px solid #ffd72b}
.detail{max-height:0;opacity:0;overflow:hidden;padding:0 12px;background:#f8fdff;transition:max-height .42s ease,opacity .28s ease,padding .42s ease}.detail.open{max-height:440px;opacity:1;padding:12px;border-top:2px solid #b9e9f5}.note.good{border-color:#75e3a2!important;background:#eaffef!important;color:#087b3a}.instruction{display:block;white-space:nowrap;font-size:clamp(12px,3.2vw,20px);margin:5px 0 10px}.panel,.note{border:2px solid #74cce9;border-radius:15px;background:#effbff;padding:12px;text-align:center;font-size:clamp(19px,4.5vw,26px);font-weight:1000}.note.pink{border-color:#ffb5cf;background:#fff1f6;color:#e82360}.up{color:#e60012;font-size:1.3em}.title{color:#1269a3;margin-bottom:10px}.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.chip{min-height:50px;border:2px solid #88b7cc;border-radius:14px;background:#fff;color:#173b59;font-size:clamp(17px,4vw,22px);font-weight:1000;padding:6px 2px}.chip.picked{background:#14a8ef;color:#fff;border-color:#087bc0;box-shadow:inset 0 2px 4px #fff7}textarea{width:100%;min-height:122px;border:2px solid #7aa8c7;border-radius:13px;padding:13px;background:#fff;color:#173b59;font:800 clamp(18px,4.2vw,23px) system-ui}textarea::placeholder{color:#9caab3;opacity:.62}.hint{text-align:center;margin:13px 8px 5px;color:#ef2866;font-size:clamp(19px,4.5vw,26px);font-weight:1000}.send{display:block;width:94%;margin:0 3%;border:0;border-radius:32px;padding:15px;background:linear-gradient(#1bbaff,#0877ec);color:#fff;font-size:clamp(28px,6.4vw,41px);font-weight:1000;box-shadow:0 5px 12px #0877ec55}.sub{text-align:center;color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(90%,620px);background:#fff;border:3px solid #159eea;border-radius:18px;padding:12px;text-align:center;font-weight:1000;display:none;z-index:20}.toast.show{display:block}

</style></head><body><main class="app"><div class="hero"><div class="bubbleText"><span class="vert">〇〇〇</span><span class="vert">だよ！</span></div><div class="datebox"><div class="date" id="date"></div><div class="weather" id="weather">☀️</div><div class="time" id="time"></div></div><div class="greeting">おはよう 母ちゃん<small>今日も元気に過ごそうね！</small></div></div><section class="list" id="list"></section><div class="hint">全て答えたら送信ボタン押してね！</div><button class="send" id="send">✉️ 返事を送る</button><div class="sub">今日の回答を保存します</div></main><div class="toast" id="toast"></div>
<script>
const data=[["🍚","朝ごはん<br>食べた？","food"],["🥤","水分補給<br>してる？","water"],["💊","心臓の薬<br>は飲んだ？","heart"],["❤️","血圧の薬<br>は飲んだ？","bp"],["🚶","軽く運動<br>してる？","move"],["🙂","体調悪い<br>ところ<br>ある？","health"],["❓","困った事<br>ある？","trouble"]],answers=Array(7).fill(null),list=document.getElementById("list"),sets={food:new Set(),health:new Set()};
function chips(a,k){return `<div class="chips ${k==="food"?"foodChips":""}">${a.map(x=>{if(k==="food"){const p=x.split("|");const img=p[0],label=p[1];return `<button type="button" class="chip foodChip" data-key="${k}" data-value="${label}"><span class="foodPhotoWrap"><img class="foodPhoto" src="${img}" alt="${label}"></span><span class="foodLabel ${label==="ヨーグルト"||label==="野菜ジュース"?"smallFoodLabel":""}">${label}</span></button>`}if(k==="health"){const p=x.split("|");return `<button type="button" class="chip healthChip health${a.indexOf(x)}" data-key="${k}" data-value="${x}"><span class="healthIcon">${p[0]}</span><span class="healthLabel">${p[1]}</span></button>`}return `<button type="button" class="chip" data-key="${k}" data-value="${x}">${x}</button>`}).join("")}</div>`}
function content(t,v){
if(t==="food"&&v==="yes")return `<div class="panel"><div class="title">🥢 何を食べたかな？🍽</div><span class="instruction">食べた物を選んでボタンを押してね！</span>${chips(["food-pan.png|パン","food-coffee.png|コーヒー","food-bento.png|弁当","food-banana.png|バナナ","food-cheese.png|チーズ","food-yogurt.png|ヨーグルト","food-tomato.png|トマト","food-cupnoodle.png|カップ麺","food-canned.png|缶詰","food-sozai.png|惣菜","food-pasta.png|パスタ","food-onigiri.png|おにぎり","food-boiledegg.png|ゆで卵","food-vegetablejuice.png|野菜ジュース","food-sayu.png|白湯"],"food")}</div>`;
if(t==="food"&&v==="no")return `<div class="note pink">ちゃんと食べな駄目だよ！</div>`;
if(t==="water"&&v==="yes")return `<div class="note good">お利口さんやね！</div>`;
if(t==="water"&&v==="no")return `<div class="note pink">💧熱中症になるから、ちゃんと飲んでね！</div>`;
if(t==="heart"&&v==="yes")return `<div class="note good">素晴らしいね！</div>`;
if(t==="heart"&&v==="no")return `<div class="note pink">血管が、詰まるから、ちゃんと飲まなきゃ駄目だよ！</div>`;
if(t==="bp"&&v==="yes")return `<div class="note good">流石やね！偉い！</div>`;
if(t==="bp"&&v==="no")return `<div class="note pink">血圧が高くなるから、ちゃんと、飲まないと、駄目だよ！</div>`;
if(t==="move"&&v==="yes")return `<div class="note good">偉いね！ゆっくりで良いからね！続けることが大事だよ！</div>`;
if(t==="move"&&v==="no")return `<div class="note pink">🦶足踏みでも良いからしてね！</div>`;
if(t==="health"&&v==="yes")return `<div class="panel"><div class="title">どこが悪い？<br><span class="healthPrompt">痛いところのボタンをタッチしてね！</span></div>${chips(["🧠|頭","🏋️|肩","🫃|お腹","🧍‍♂️|背中","🧘|腰","🦵|足の付け根","🦴|尾骶骨","🚽|便秘","😷|咳","🌡️|熱い","❄️|寒い","😮‍💨|だるい","🦿|膝","🦴|関節","🦶|足のむくみ"],"health")}</div>`;
if(t==="health"&&v==="no")return `<div class="note good">調子良いのが1番！</div>`;
if(t==="trouble"&&v==="yes")return `<div class="panel"><textarea placeholder="ここをタッチして困った事を入力してね。"></textarea></div>`;return ""}
data.forEach((d,i)=>{const q=document.createElement("article");q.className="q";q.innerHTML=`<div class="row"><div class="ico">${d[0]}</div><div class="text">${d[1]}</div><div class="check"></div><button class="yn yes">はい</button><button class="yn no">いいえ</button></div><div class="detail"></div>`;const y=q.querySelector(".yes"),n=q.querySelector(".no"),c=q.querySelector(".check"),det=q.querySelector(".detail");function choose(v){answers[i]=v;c.textContent="✓";y.classList.toggle("selected",v==="yes");n.classList.toggle("selected",v==="no");const h=content(d[2],v);det.classList.remove("open");setTimeout(()=>{det.innerHTML=h;det.classList.toggle("open",!!h);det.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const set=sets[b.dataset.key];set.has(b.dataset.value)?set.delete(b.dataset.value):set.add(b.dataset.value);b.classList.toggle("picked",set.has(b.dataset.value))})},80)}y.onclick=()=>choose("yes");n.onclick=()=>choose("no");list.appendChild(q)});
function updateClock(){const d=new Date();document.getElementById("date").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;document.getElementById("time").textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}updateClock();setInterval(updateClock,1000);
send.onclick=()=>{const t=document.getElementById("toast");if(!answers.every(Boolean))t.textContent="まだ答えていない項目があるよ😊";else{const trouble=document.querySelector("textarea")?.value||"";localStorage.setItem("motherCareLastAnswers",JSON.stringify({at:new Date().toISOString(),answers,food:[...sets.food],health:[...sets.health],trouble}));t.textContent="回答を保存したよ😊"}t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
</script></body></html>
