<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お薬飲めたかな？ | MY MOTHER CARE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#dff6ff}
.app{position:relative;width:min(100vw,768px);margin:auto;aspect-ratio:2/3;background:url("my-mother-care-home-final.webp") center top/100% 100% no-repeat;overflow:hidden}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit:active{background:#fff2;border-radius:40px}
.ck{position:absolute;width:5.2%;aspect-ratio:1;display:grid;place-items:center;font:1000 clamp(20px,4.6vw,42px)/1 system-ui;color:#ed101c;pointer-events:none}
.ck:empty{display:none}
.toast{position:absolute;left:10%;right:10%;top:73%;padding:12px;background:#fff;border:3px solid #159eea;border-radius:22px;text-align:center;font:900 18px system-ui;color:#17304d;display:none;z-index:5;box-shadow:0 6px 18px #0003}
.toast.show{display:block}
.send{left:13%;top:80.1%;width:74%;height:8.4%}
</style>
</head>
<body>
<main class="app" id="app" aria-label="お薬飲めたかな？">
<div class="toast" id="toast">全部答えられたよ😊<br>「返事を送る」を押してね</div>
</main>
<script>
const app=document.getElementById("app"),toast=document.getElementById("toast");
const answers=Array(6).fill(null);
/* 順番：朝ごはん、水分、心臓の薬、血圧の薬、運動、体調 */
const rows=[
 [[5.7,42.7,20.3,6.4],[27.2,42.7,20.3,6.4],[42.4,36.2]],
 [[52.9,42.7,20.3,6.4],[74.5,42.7,20.3,6.4],[89.7,36.2]],
 [[5.7,57.7,20.3,6.4],[27.2,57.7,20.3,6.4],[42.4,51.2]],
 [[52.9,57.7,20.3,6.4],[74.5,57.7,20.3,6.4],[89.7,51.2]],
 [[5.7,72.8,20.3,6.4],[27.2,72.8,20.3,6.4],[42.4,66.3]],
 [[52.9,72.8,20.3,6.4],[74.5,72.8,20.3,6.4],[89.7,66.3]]
];
const checks=[];
function addHit(r,i,value){
 const b=document.createElement("button"); b.className="hit";
 b.setAttribute("aria-label",(i+1)+"番 "+value);
 Object.assign(b.style,{left:r[0]+"%",top:r[1]+"%",width:r[2]+"%",height:r[3]+"%"});
 b.onclick=()=>{
   answers[i]=value;
   checks[i].textContent="✓";
   if(answers.every(Boolean)){toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1600)}
 };
 app.appendChild(b);
}
rows.forEach((r,i)=>{
 const c=document.createElement("div"); c.className="ck";
 c.style.left=r[2][0]+"%"; c.style.top=r[2][1]+"%";
 app.appendChild(c); checks.push(c);
 addHit(r[0],i,"はい"); addHit(r[1],i,"いいえ");
});
const send=document.createElement("button");send.className="hit send";send.setAttribute("aria-label","返事を送る");
send.onclick=()=>alert(answers.every(Boolean)?"回答できたよ😊\n送信機能は次の段階で接続します。":"まだ答えていない項目があるよ😊");
app.appendChild(send);
</script>
</body></html>
