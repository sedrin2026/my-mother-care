<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>お薬飲めたかな？</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#102c4d;background:#bdefff}.app{width:min(100%,760px);margin:auto;min-height:100dvh;background:linear-gradient(#65c9ff,#d7f7ff 34%,#c8f1e7);padding:8px}.top{display:grid;grid-template-columns:1fr 90px 1fr;gap:7px;align-items:center}.box{background:#fffffff0;border-radius:18px;padding:7px;text-align:center;font-weight:900}.brand{color:#ff2370;font-size:17px}.face{width:84px;height:84px;border-radius:50%;border:4px solid #fff;outline:3px solid #ff91c6;background:#fff;display:grid;place-items:center;font-size:39px;margin:auto}.clock b{font-size:25px}.greet{margin:7px 2px;background:#fff0f6;border-radius:18px;text-align:center;padding:7px}.greet b{display:block;color:#f21d65;font-size:clamp(25px,6vw,38px)}.greet span{font-weight:900}.list{display:grid;gap:6px}.q{background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 3px 9px #17657d20}.main{display:grid;grid-template-columns:46px 1fr 34px minmax(76px,21%) minmax(76px,21%);gap:5px;align-items:center;padding:7px}.ico{font-size:33px;text-align:center}.txt{font-weight:1000;font-size:clamp(16px,3.8vw,23px);line-height:1.15}.check{width:29px;height:29px;border:3px solid #8293a0;border-radius:6px;display:grid;place-items:center;color:#e60012;font-size:25px;font-weight:1000}.yn{border:0;border-radius:25px;padding:10px 2px;color:#fff;font-size:clamp(17px,4vw,25px);font-weight:1000}.yes{background:linear-gradient(#18c04b,#00992d)}.no{background:linear-gradient(#ff5a9c,#ff1772)}.yn.selected{outline:4px solid #ffd82c}.detail{max-height:0;opacity:0;overflow:hidden;padding:0 10px;background:#f7fdff;transition:.38s ease}.detail.open{max-height:280px;opacity:1;padding:9px 10px 11px;border-top:2px solid #b7e8f5}.note{border:2px solid #ffb8d0;background:#fff1f6;border-radius:12px;padding:10px;text-align:center;font-weight:1000;color:#ed245f;font-size:clamp(16px,3.8vw,21px)}.field{display:grid;gap:6px;font-weight:900;color:#1268a3}.field input,.field textarea{width:100%;font:700 18px system-ui;border:2px solid #7aa8c7;border-radius:10px;padding:10px}.field textarea{min-height:90px}.radios{display:flex;flex-wrap:wrap;gap:8px 13px;font-weight:900;font-size:17px}.radios label{display:flex;align-items:center;gap:4px}.radios input{width:22px;height:22px}.send{width:94%;margin:10px 3% 0;border:0;border-radius:30px;padding:13px;background:linear-gradient(#19b8ff,#0877ed);color:#fff;font-size:clamp(25px,6vw,36px);font-weight:1000}.sub{text-align:center;color:#fff;font-weight:800}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(90%,620px);background:#fff;border:3px solid #16a0e9;border-radius:18px;padding:12px;text-align:center;font-weight:900;display:none;z-index:10}.toast.show{display:block}
</style></head><body><main class="app"><section class="top"><div><div class="box brand">💊 お薬<br>飲めたかな？</div><div class="box">☀️ 晴れ<br><b>28℃</b></div></div><div class="face">👨‍🧢</div><div><div class="box">母ちゃん<br>いつもありがとう😊</div><div class="box clock"><span id="date"></span><br><b id="time"></b></div></div></section><div class="greet"><b>おはよう 母ちゃん☀️</b><span>今日も元気で過ごそうね！</span></div><section class="list" id="list"></section><button class="send" id="send">✈️ 返事を送る</button><div class="sub">今日の回答を送信します</div></main><div class="toast" id="toast"></div>
<script>
const data=[["🍚","朝ごはんを食べたかな？","food"],["🥤","水分は摂ってるかな？","water"],["💊","心臓の薬は飲んだかな？","heart"],["❤️","血圧の薬は飲んだかな？","bp"],["🚶","少し運動しようね！","move"],["🙂","どこか体調の悪いところあるかな？","health"],["❓","何か困った事はある？","trouble"]],ans=Array(7).fill(null),list=document.getElementById("list");
function detail(type,v){if(type==="food"&&v==="yes")return `<div class="field">🍴 何を食べたかな？<input placeholder="例：ごはん、パン、納豆など"></div>`;if(type==="food"&&v==="no")return `<div class="note">ちゃんと食べな、いかんばい！<br>消費期限も確認してね！</div>`;if(type==="water"&&v==="no")return `<div class="note">💧 熱中症になるから飲んでね！</div>`;if(type==="heart"&&v==="no")return `<div class="note">❤️ 血管がサラサラになるから飲もうね！</div>`;if(type==="bp"&&v==="no")return `<div class="note">🩺 血圧高くなるから飲んでよ！</div>`;if(type==="move"&&v==="no")return `<div class="note">👟 その場で足踏みでも良いからするんだよ！</div>`;if(type==="health"&&v==="yes")return `<div class="field">どこが悪い？（1つ選んでね）<div class="radios">${["頭","咳","熱","腰","尾骶骨","足の付け根"].map(x=>`<label><input type="radio" name="symptom">${x}</label>`).join("")}</div></div>`;if(type==="trouble"&&v==="yes")return `<div class="field">困った事をここに入力してね。<textarea placeholder="ここに入力してね"></textarea></div>`;return ""}
data.forEach((d,i)=>{let q=document.createElement("article");q.className="q";q.innerHTML=`<div class="main"><div class="ico">${d[0]}</div><div class="txt">${d[1]}</div><div class="check"></div><button class="yn yes">はい</button><button class="yn no">いいえ</button></div><div class="detail"></div>`;let c=q.querySelector(".check"),det=q.querySelector(".detail"),y=q.querySelector(".yes"),n=q.querySelector(".no");function choose(v){ans[i]=v;c.textContent="✓";y.classList.toggle("selected",v==="yes");n.classList.toggle("selected",v==="no");let h=detail(d[2],v);det.innerHTML=h;det.classList.toggle("open",!!h);if(h)setTimeout(()=>det.scrollIntoView({behavior:"smooth",block:"nearest"}),120)}y.onclick=()=>choose("yes");n.onclick=()=>choose("no");list.appendChild(q)});
function now(){let d=new Date();date.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;time.textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}now();setInterval(now,1000);
send.onclick=()=>{toast.textContent=ans.every(Boolean)?"回答できたよ😊 送信機能は次の段階で接続します。":"まだ答えていない項目があるよ😊";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)};
</script></body></html>
