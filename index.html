<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>お薬飲めたかな？</title><style>*{box-sizing:border-box}html,body{margin:0;background:#bdefff}.app{position:relative;width:min(100vw,768px);margin:auto}.base{display:block;width:100%;height:auto}.hit{position:absolute;border:0;background:transparent;-webkit-tap-highlight-color:transparent}.hit:active{background:#fff2;border-radius:20px}.flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(90%,620px);background:#fff;border:3px solid #159eea;border-radius:18px;padding:12px;text-align:center;font:900 17px system-ui;color:#17304d;display:none;z-index:20}.flash.show{display:block}</style></head><body><main class="app" id="app"><img class="base" src="my-mother-care-home-large-text.webp" alt="お薬飲めたかな？"></main><div class="flash" id="flash"></div><script>
const app=document.getElementById("app"),f=document.getElementById("flash"),ans=Array(7).fill(null),food=new Set(),sym=new Set();function hit(x,y,w,h,fn,l){let b=document.createElement("button");b.className="hit";b.ariaLabel=l||"";Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});b.onclick=fn;app.appendChild(b)}function msg(t){f.textContent=t;f.classList.add("show");setTimeout(()=>f.classList.remove("show"),1300)}function a(i,v){ans[i]=v;msg(v==="yes"?"「はい」を選んだよ😊":"「いいえ」を選んだよ😊")}
