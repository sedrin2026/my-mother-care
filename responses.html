<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MY MOTHER CARE - 回答確認</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edfaff;color:#18364b;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(8px);padding:14px 16px;border-bottom:2px solid #ccebf4}
.head{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:21px;margin:0;color:#1378b9}.small{font-size:12px;color:#617887}
button{border:0;border-radius:22px;padding:10px 14px;font-weight:900;font-size:14px}
#login{background:#147cc0;color:#fff}#logout{background:#e9f2f7;color:#3f5c6d;display:none}
main{max-width:720px;margin:auto;padding:16px}
#state{background:#fff;border:2px solid #ccebf4;border-radius:18px;padding:16px;text-align:center;font-weight:900;margin-bottom:14px}
.card{background:#fff;border:2px solid #ccebf4;border-radius:22px;padding:17px;margin:0 0 14px;box-shadow:0 7px 20px #1a6c8420}
.card.latest{border-color:#72dca0;box-shadow:0 7px 22px #1a9a5b20}
.title{font-size:20px;font-weight:1000;margin-bottom:5px}.date{font-size:13px;color:#667b88;margin-bottom:13px}
.row{padding:10px 0;border-top:1px solid #e7f0f4;font-size:16px;line-height:1.45}
.label{font-weight:900}.detail{margin-top:5px;padding-left:26px;color:#36596e}
.empty{color:#718592}.badge{display:inline-block;background:#e7fff0;color:#087b3a;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:900;margin-left:6px}
.err{background:#fff0f3!important;border-color:#ffb4c7!important;color:#b81742}
#realtimeAlert{position:fixed;inset:0;z-index:9999;background:#fffffffa;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#realtimeAlert.show{display:flex}
#realtimeAlert .box{width:min(92vw,560px);background:#fff;border:4px solid #72dca0;border-radius:28px;padding:32px 20px;box-shadow:0 12px 40px #0002}
#realtimeAlert .big{font-size:clamp(27px,7vw,42px);font-weight:1000;color:#087b3a;line-height:1.35}
#realtimeAlert .submsg{margin-top:14px;font-size:clamp(17px,4.5vw,24px);font-weight:900}
#realtimeAlert button{margin-top:24px;background:#147cc0;color:#fff;font-size:20px;padding:13px 28px}
</style></head>
<body>
<header><div class="head"><div><h1>💌 MY MOTHER CARE</h1><div class="small">母ちゃんの回答確認</div></div><div><button id="login">Googleでログイン</button><button id="logout">ログアウト</button></div></div></header>
<main><div id="state">ログイン状態を確認しています…</div><section id="list"></section></main>
<div id="realtimeAlert" role="alert"><div class="box"><div class="big">💌 母ちゃんから<br>返事が届きました！</div><div class="submsg">最新の回答を確認してください😊</div><button id="alertClose" type="button">回答を見る</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,collection,query,orderBy,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyDUccPZVteo8ikjRXgZYBuy2vcG9Chpqr8",authDomain:"my-mother-care.firebaseapp.com",projectId:"my-mother-care",storageBucket:"my-mother-care.firebasestorage.app",messagingSenderId:"772945697337",appId:"1:772945697337:web:03b249c3767237ea210be8"};
const ADMIN_UID="1cmgGRhWrmPsCubkV38C2Fakcpp1";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const login=document.getElementById("login"),logout=document.getElementById("logout"),state=document.getElementById("state"),list=document.getElementById("list");
let stop=null,initialSnapshot=true,newestDocId=null;
const realtimeAlert=document.getElementById("realtimeAlert"),alertClose=document.getElementById("alertClose");
alertClose.onclick=()=>realtimeAlert.classList.remove("show");
function realtimeNotice(){
 realtimeAlert.classList.add("show");
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){const ctx=new AC(),g=ctx.createGain();g.gain.value=.18;g.connect(ctx.destination);
   [0,.28,.56].forEach((d,i)=>{const o=ctx.createOscillator();o.frequency.value=[880,1175,1320][i];o.connect(g);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.2)});
   setTimeout(()=>ctx.close().catch(()=>{}),1200)}
 }catch(e){console.warn("通知音",e)}
 if(navigator.vibrate)navigator.vibrate([250,120,250,120,450]);
}
login.onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){state.className="err";state.textContent="ログインできませんでした："+(e.code||e.message)}};
logout.onclick=()=>signOut(auth);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yn=v=>v==="yes"?"はい":v==="no"?"いいえ":v===true?"はい":v===false?"いいえ":(v||"未回答");
const labels=["🍚 朝ごはん","🥤 水分補給","💊 心臓の薬","❤️ 血圧の薬","🚶 軽く運動","🙂 体調悪いところ","❓ 困ったこと"];
function when(d){
 let x=d?.createdAt?.toDate?.();
 if(!x && d?.clientAt)x=new Date(d.clientAt);
 if(!x||isNaN(x))return"日時不明";
 return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(x);
}
function card(d,i){
 const a=Array.isArray(d.answers)?d.answers:[];
 const food=Array.isArray(d.food)&&d.food.length?d.food.join("・"):"なし";
 const health=Array.isArray(d.health)&&d.health.length?d.health.join("・"):"なし";
 const trouble=(d.trouble||"").trim()||"なし";
 return `<article class="card ${i===0?"latest":""}">
 <div class="title">💌 母ちゃんから返事が届きました ${i===0?'<span class="badge">最新</span>':""}</div>
 <div class="date">送信日時：${esc(when(d))}</div>
 <div class="row"><span class="label">${labels[0]}：</span>${esc(yn(a[0]))}<div class="detail">🥢 食べた物：${esc(food)}</div></div>
 <div class="row"><span class="label">${labels[1]}：</span>${esc(yn(a[1]))}</div>
 <div class="row"><span class="label">${labels[2]}：</span>${esc(yn(a[2]))}</div>
 <div class="row"><span class="label">${labels[3]}：</span>${esc(yn(a[3]))}</div>
 <div class="row"><span class="label">${labels[4]}：</span>${esc(yn(a[4]))}</div>
 <div class="row"><span class="label">${labels[5]}：</span>${esc(yn(a[5]))}<div class="detail">🩺 症状：${esc(health)}</div></div>
 <div class="row"><span class="label">${labels[6]}：</span>${esc(yn(a[6]))}<div class="detail">📝 内容：${esc(trouble)}</div></div>
 </article>`;
}
function listen(){
 if(stop)stop();
 const q=query(collection(db,"responses"),orderBy("createdAt","desc"),limit(50));
 initialSnapshot=true;newestDocId=null;
 stop=onSnapshot(q,snap=>{
   state.className="";
   state.textContent=`🔴 リアルタイム受信中　回答 ${snap.size}件`;
   list.innerHTML=snap.empty?'<div class="card empty">まだ回答は届いていません。</div>':snap.docs.map((x,i)=>card(x.data(),i)).join("");
   const currentNewest=snap.docs[0]?.id||null;
   if(initialSnapshot){newestDocId=currentNewest;initialSnapshot=false;return}
   if(currentNewest&&currentNewest!==newestDocId){newestDocId=currentNewest;realtimeNotice()}
 },e=>{state.className="err";state.textContent="回答を読み込めません："+(e.code||e.message);list.innerHTML=""});
}
onAuthStateChanged(auth,u=>{
 if(stop){stop();stop=null}
 if(!u){login.style.display="inline-block";logout.style.display="none";state.className="";state.textContent="🔐 Googleでログインすると回答を確認できます。";list.innerHTML="";return}
 login.style.display="none";logout.style.display="inline-block";
 if(u.uid!==ADMIN_UID){state.className="err";state.textContent="このGoogleアカウントには閲覧権限がありません。";list.innerHTML="";return}
 state.className="";state.textContent="接続しています…";listen();
});
</script></body></html>
